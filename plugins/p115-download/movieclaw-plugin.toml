[plugin]
id = "p115-download"
title = "115 云下载"
version = "0.2.0"
entry = "p115_download"
runtime = "process"
sdk = "^1.0"
description = "把 115 云下载（离线）接成 MovieClaw 的下载器类型 p115：磁力 / ed2k 直接投给 115；配置待刮削目录后，新出现的条目自动识别、移入媒体库并触发扫描（STRM 交给 p115-library）。PT 资源继续走 qBittorrent。"

[requires]
"downloader-adapters" = "^1.0"
"host-ops" = "^1.0"

[permissions]
operations = [
  "dl.resolve-target",
  "library.scan.start",
]
network = true
